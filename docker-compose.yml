version: '3.8'

services:
  career-hub-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-hub-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - career-hub-network

networks:
  career-hub-network:
    driver: bridge
